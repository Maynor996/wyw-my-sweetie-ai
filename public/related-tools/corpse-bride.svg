<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="corpsebride AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a33"/>
      <stop offset="55%" stop-color="#163a5f"/>
      <stop offset="100%" stop-color="#1a4d6e"/>
    </linearGradient>
    <linearGradient id="mist" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- moon -->
  <circle cx="392" cy="118" r="36" fill="#e2e8f0" opacity="0.9"/>
  <circle cx="404" cy="110" r="28" fill="#0b1a33" opacity="0.55"/>
  <!-- tombstones -->
  <path d="M78 420 V300 c0-28 18-48 42-48 s42 20 42 48 V420 Z" fill="#334155"/>
  <rect x="98" y="330" width="44" height="10" rx="2" fill="#64748b" opacity="0.7"/>
  <path d="M360 420 V280 c0-34 22-58 52-58 s52 24 52 58 V420 Z" fill="#1e293b"/>
  <rect x="388" y="318" width="48" height="10" rx="2" fill="#64748b" opacity="0.55"/>
  <!-- ground mist -->
  <ellipse cx="256" cy="430" rx="210" ry="46" fill="url(#mist)"/>
  <ellipse cx="180" cy="410" rx="90" ry="28" fill="#7dd3fc" opacity="0.25"/>
  <ellipse cx="330" cy="418" rx="100" ry="30" fill="#bae6fd" opacity="0.2"/>
  <!-- ghost bride silhouette with veil -->
  <ellipse cx="256" cy="168" rx="46" ry="50" fill="url(#veil)"/>
  <!-- veil train -->
  <path d="M210 150 C160 190 140 260 150 330 C180 300 210 270 230 250 L230 180 Z" fill="#cbd5e1" opacity="0.75"/>
  <path d="M302 150 C352 190 372 260 362 330 C332 300 302 270 282 250 L282 180 Z" fill="#94a3b8" opacity="0.55"/>
  <!-- neck / shoulders / dress -->
  <path d="M230 210 C236 198 246 192 256 192 s20 6 26 18
           L310 300 C318 320 308 340 286 348
           L270 420 L242 420 L226 348
           C204 340 194 320 202 300 Z" fill="#f1f5f9"/>
  <!-- bouquet hint -->
  <circle cx="200" cy="300" r="14" fill="#67e8f9" opacity="0.8"/>
  <circle cx="214" cy="288" r="10" fill="#a5f3fc" opacity="0.7"/>
  <!-- blue mist rising feet -->
  <path d="M220 400 C200 360 210 330 230 310 C250 340 270 340 290 310 C310 330 320 360 300 400 Z" fill="#38bdf8" opacity="0.45"/>
</svg>
